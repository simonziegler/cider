[build-system]
# nanobind must match the version mlx was built with (mlx 0.32.x: 2.13.0).
# A newer nanobind (3.x, ABI v22) builds cleanly and then rejects every
# mx.array argument at call time.
requires = ["setuptools>=68", "wheel", "nanobind==2.13.0", "mlx>=0.31", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "cider"
version = "0.8.0"
description = "INT8 TensorOps quantized matmul + optimized SDPA for Apple M5+ (W8A8, W4A8)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Wang Shuo"},
]
dependencies = [
    "mlx>=0.31",
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Mininglamp-AI/cider"

[tool.setuptools.packages.find]
include = ["cider*", "vlm_service*"]

[tool.setuptools.package-data]
"cider" = ["kernels/*.metal", "kernels/*.h", "lib/*.so", "lib/*.dylib"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn", "pyyaml"]
